name: postgres
module: vendor_management
version: 0.1.0
description: Custom Postgres adapter for vendor_management
languages: [typescript, python, go, rust, java]

implements:
  - registerVendor
  - getVendor
  - listVendors
  - updateVendor
  - recordContract
  - getContracts
  - assessVendorHealth
  - flagVendorRisk
  - initiateOffboarding
  - getVendorReport

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org