name: postgres
module: bank_reconciliation
version: 0.1.0
description: Custom Postgres adapter for bank_reconciliation
languages: [typescript, python, go, rust, java]

implements:
  - createBankReconciliationRun
  - getBankReconciliationRun
  - listBankReconciliationRuns
  - getStatementMatches
  - resolveStatementMatch
  - closeBankReconciliationRun

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org