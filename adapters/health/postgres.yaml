name: postgres
module: health
version: 0.1.0
description: Custom Postgres adapter for health
languages: [typescript, python, go, rust, java]

implements:
  - check
  - checkAll
  - registerCheck
  - livenessProbe
  - readinessProbe
  - startupProbe
  - getStatus
  - getHistory
  - setDependencyThreshold

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org