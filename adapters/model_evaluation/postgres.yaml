name: postgres
module: model_evaluation
version: 0.1.0
description: Custom Postgres adapter for model_evaluation
languages: [typescript, python, go, rust, java]

implements:
  - createEvaluation
  - getEvaluation
  - listEvaluations
  - runEvaluation
  - getRunResults
  - getMetricHistory
  - registerMetric
  - setBaseline
  - detectRegression

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org