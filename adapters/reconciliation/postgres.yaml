name: postgres
module: reconciliation
version: 0.1.0
description: Custom Postgres adapter for reconciliation
languages: [typescript, python, go, rust, java]

implements:
  - createReconciliationRun
  - getReconciliationRun
  - listReconciliationRuns
  - getDiscrepancies
  - resolveDiscrepancy
  - retryRun
  - closeRun

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org