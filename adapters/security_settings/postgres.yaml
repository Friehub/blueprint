name: postgres
module: security_settings
version: 0.1.0
description: Custom Postgres adapter for security_settings
languages: [typescript, python, go, rust, java]

implements:
  - getSecuritySettings
  - enableTwoFactor
  - disableTwoFactor
  - generateRecoveryCodes
  - revokeRecoveryCode
  - listTrustedDevices
  - revokeTrustedDevice
  - setLoginAlerts

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org