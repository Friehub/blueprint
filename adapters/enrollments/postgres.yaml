name: postgres
module: enrollments
version: 0.1.0
description: Custom Postgres adapter for enrollments
languages: [typescript, python, go, rust, java]

implements:
  - enrollStudent
  - getEnrollment
  - getEnrollmentByCourseAndStudent
  - listEnrollments
  - updateProgress
  - completeLesson
  - completeCourse
  - withdrawEnrollment
  - issueCertificate

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org