name: postgres
module: circuit_breaker
version: 0.1.0
description: Custom Postgres adapter for circuit_breaker
languages: [typescript, python, go, rust, java]

implements:
  - getState
  - trip
  - recordSuccess
  - recordFailure
  - reset
  - getMetrics
  - registerBreaker

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org