name: postgres
module: usage_billing
version: 0.1.0
description: Custom Postgres adapter for usage_billing
languages: [typescript, python, go, rust, java]

implements:
  - recordUsage
  - getUsage
  - aggregateUsage
  - createUsageCharge
  - finalizeUsageCharge
  - adjustUsageCharge
  - closeUsagePeriod

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org