name: postgres
module: web_analytics
version: 0.1.0
description: Custom Postgres adapter for web_analytics
languages: [typescript, python, go, rust, java]

implements:
  - trackPageView
  - trackSessionStart
  - trackSessionEnd
  - trackConversion
  - getPageMetrics
  - getAttributionReport
  - getSessionReplay

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org