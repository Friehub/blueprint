name: postgres
module: live_updates
version: 0.1.0
description: Custom Postgres adapter for live_updates
languages: [typescript, python, go, rust, java]

implements:
  - subscribe
  - unsubscribe
  - getSubscriptions
  - pushUpdate
  - broadcast
  - reconnect
  - getSubscriptionStatus

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org