name: postgres
module: permissions
version: 0.1.0
description: Custom Postgres adapter for permissions
languages: [typescript, python, go, rust, java]

implements:
  - can
  - canAll
  - canAny
  - batchCheckPermission
  - grantPermission
  - revokePermission
  - denyPermission
  - revokeDeny
  - getPermissions
  - createRole
  - assignRole

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org