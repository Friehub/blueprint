name: postgres
module: idempotency_store
version: 0.1.0
description: Custom Postgres adapter for idempotency_store
languages: [typescript, python, go, rust, java]

implements:
  - storeResult
  - getResult
  - cleanupExpired
  - isDuplicate

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org