name: postgres
module: payments
version: 0.1.0
description: Custom Postgres adapter for payments
languages: [typescript, python, go, rust, java]

implements:
  - initiatePayment
  - verifyPayment
  - getPaymentByOrder
  - getWallet
  - creditWallet
  - debitWallet
  - getWalletTransactions
  - initiateRefund
  - getRefundByOrder
  - getRefund

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org