name: postgres
module: migration_strategies
version: 0.1.0
description: Custom Postgres adapter for migration_strategies
languages: [typescript, python, go, rust, java]

implements:
  - planMigration
  - validateStrategy
  - executeExpandPhase
  - executeMigratePhase
  - executeContractPhase
  - executeDualWrite
  - createBackfill
  - rollbackPhase

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org