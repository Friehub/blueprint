name: postgres
module: sessions
version: 0.1.0
description: Custom Postgres adapter for sessions
languages: [typescript, python, go, rust, java]

implements:
  - createSession
  - getSession
  - getSessions
  - listActiveSessions
  - revokeSession
  - revokeAllSessions
  - extendSession

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org