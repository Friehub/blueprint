name: redis
module: sessions
version: 0.1.0
description: Redis session store adapter for fast ephemeral session management
languages: [typescript, python, go, rust, java]

implements:
  - createSession
  - getSession
  - revokeSession
  - extendSession
  - getSessions
  - listActiveSessions
  - revokeAllSessions

does_not_implement: []

config:
  required:
    - name: connection_string
      type: string
      description: Redis connection string
      secret: true
  optional:
    - name: key_prefix
      type: string
      default: "sess:"
      description: Redis key prefix for session entries
    - name: ttl_seconds
      type: integer
      default: 86400
      description: Session TTL in seconds

metadata:
  provider_url: https://redis.io
  docs_url: https://redis.io/docs
