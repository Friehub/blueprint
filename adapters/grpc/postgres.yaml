name: postgres
module: grpc
version: 0.1.0
description: Custom Postgres adapter for grpc
languages: [typescript, python, go, rust, java]

implements:
  - defineService
  - defineMethod
  - createServer
  - createClient
  - startServer
  - addInterceptor
  - setDeadline
  - healthCheck

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org