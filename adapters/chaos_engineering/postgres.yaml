name: postgres
module: chaos_engineering
version: 0.1.0
description: Custom Postgres adapter for chaos_engineering
languages: [typescript, python, go, rust, java]

implements:
  - defineExperiment
  - getExperiment
  - listExperiments
  - runExperiment
  - stopExperiment
  - injectFailure
  - validateSteadyState
  - rollbackExperiment
  - scheduleExperiment

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org