name: postgres
module: customer_support
version: 0.1.0
description: Custom Postgres adapter for customer_support
languages: [typescript, python, go, rust, java]

implements:
  - createTicket
  - assignTicket
  - addTicketMessage
  - transitionTicketStatus
  - checkSLA

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org