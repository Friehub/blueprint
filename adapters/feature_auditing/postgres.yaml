name: postgres
module: feature_auditing
version: 0.1.0
description: Custom Postgres adapter for feature_auditing
languages: [typescript, python, go, rust, java]

implements:
  - getFeatureAuditTrail
  - getFeatureAuditEntry
  - listFeatureAuditEntries
  - exportFeatureAudit
  - compareFeatureVersions

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org