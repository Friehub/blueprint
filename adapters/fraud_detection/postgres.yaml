name: postgres
module: fraud_detection
version: 0.1.0
description: Custom Postgres adapter for fraud_detection
languages: [typescript, python, go, rust, java]

implements:
  - scoreTransaction
  - scoreSignUp
  - scoreLogin
  - reportFraud
  - blockEntity
  - unblockEntity
  - isBlocked
  - getRiskHistory
  - submitFeedback
  - getFeedbackHistory
  - requestBlockReview
  - resolveBlockReview

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org