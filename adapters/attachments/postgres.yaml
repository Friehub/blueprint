name: postgres
module: attachments
version: 0.1.0
description: Custom Postgres adapter for attachments
languages: [typescript, python, go, rust, java]

implements:
  - createAttachment
  - getAttachment
  - listAttachments
  - linkAttachment
  - unlinkAttachment
  - deleteAttachment
  - createPreview
  - getPreview

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org