name: postgres
module: courses
version: 0.1.0
description: Custom Postgres adapter for courses
languages: [typescript, python, go, rust, java]

implements:
  - createCourse
  - getCourse
  - listCourses
  - updateCourse
  - publishCourse
  - archiveCourse
  - addLesson
  - updateLesson
  - reorderLessons
  - listLessons

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org