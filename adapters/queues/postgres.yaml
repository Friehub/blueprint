name: postgres
module: queues
version: 0.1.0
description: Custom Postgres adapter for queues
languages: [typescript, python, go, rust, java]

implements:
  - enqueue
  - enqueueBulk
  - scheduleJob
  - cancelJob
  - getJob
  - getJobStatus
  - retryJob
  - getQueueStats
  - purgeQueue

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org