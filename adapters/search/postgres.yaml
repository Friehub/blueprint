name: postgres
module: search
version: 0.1.0
description: Custom Postgres adapter for search
languages: [typescript, python, go, rust, java]

implements:
  - indexDocument
  - indexBulk
  - removeDocument
  - search
  - multiSearch
  - suggest
  - reindex
  - getIndexStats
  - createIndex
  - deleteIndex

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org