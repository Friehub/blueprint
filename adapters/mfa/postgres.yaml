name: postgres
module: mfa
version: 0.1.0
description: Custom Postgres adapter for mfa
languages: [typescript, python, go, rust, java]

implements:
  - setupTotp
  - verifyTotp
  - setupSmsOtp
  - sendSmsOtp
  - verifySmsOtp
  - setupEmailOtp
  - sendEmailOtp
  - verifyEmailOtp
  - setupFido2
  - verifyFido2
  - generateBackupCodes
  - verifyBackupCode
  - getMFAStatus
  - disableMFA
  - disableAllMFA
  - listMFAMethods

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org