name: postgres
module: document_editor
version: 0.1.0
description: Custom Postgres adapter for document_editor
languages: [typescript, python, go, rust, java]

implements:
  - createDocument
  - saveRevision
  - getRevisionHistory
  - restoreRevision
  - acquireEditLock

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org