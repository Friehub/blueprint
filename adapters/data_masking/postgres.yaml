name: postgres
module: data_masking
version: 0.1.0
description: Custom Postgres adapter for data_masking
languages: [typescript, python, go, rust, java]

implements:
  - maskField
  - maskDocument
  - tokenize
  - detokenize
  - anonymize
  - registerMaskingRule
  - listMaskingRules
  - redactLog
  - scanForPii

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org