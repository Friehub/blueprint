name: postgres
module: inventory
version: 0.1.0
description: Custom Postgres adapter for inventory
languages: [typescript, python, go, rust, java]

implements:
  - getStockLevel
  - getStockLevels
  - reserveStock
  - releaseStock
  - confirmStock
  - updateStockOnHand
  - adjustStock
  - getStockHistory
  - getLowStockAlerts

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org