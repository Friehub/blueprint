name: postgres
module: file_upload
version: 0.1.0
description: Custom Postgres adapter for file_upload
languages: [typescript, python, go, rust, java]

implements:
  - initiateUpload
  - uploadChunk
  - completeUpload
  - cancelUpload
  - getUploadSession
  - getSignedUrl
  - requestVirusScan
  - invalidateCdn
  - deleteFile

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org