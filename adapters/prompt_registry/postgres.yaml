name: postgres
module: prompt_registry
version: 0.1.0
description: Custom Postgres adapter for prompt_registry
languages: [typescript, python, go, rust, java]

implements:
  - registerPrompt
  - getPrompt
  - listPrompts
  - updatePrompt
  - activateVersion
  - evaluatePrompt
  - createABTest
  - getABTestResults
  - archivePrompt

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org