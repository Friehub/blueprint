name: postgres
module: workspaces
version: 0.1.0
description: Custom Postgres adapter for workspace isolation with member management and resource aggregation
languages: [typescript, python, go, rust, java]

implements:
  - createWorkspace
  - addWorkspaceMember
  - removeWorkspaceMember
  - getWorkspaceResources

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection URL for workspace database
      secret: true
  optional:
    - name: schema
      type: string
      description: Database schema for workspace tables
      default: workspaces

dependencies:
  - database/migrations

metadata:
  provider_url: https://postgresql.org
  docs_url: https://postgresql.org/docs
