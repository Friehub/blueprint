name: postgres
module: connection_pool
version: 0.1.0
description: Custom Postgres adapter for connection_pool
languages: [typescript, python, go, rust, java]

implements:
  - acquire
  - release
  - getPoolStatus
  - resizePool
  - drainPool
  - getPoolMetrics
  - validateConnection
  - registerConnectionLeak
  - setPoolResizePolicy
  - setConnectionHealthCheck
  - evictConnection

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org