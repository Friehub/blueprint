name: hashicorp_vault
module: secrets
version: 0.1.0
description: HashiCorp Vault adapter for secrets management
languages: [typescript, python, go, rust, java]

implements:
  - createSecret
  - getSecretMetadata
  - getSecretValue
  - updateSecretValue
  - initiateRotation
  - confirmRotation
  - revokeSecret
  - listSecrets
  - grantAccess
  - revokeAccess
  - listVersions
  - scheduleRotation

does_not_implement: []

config:
  required:
    - name: address
      type: string
      description: Vault server address (e.g., https://vault.example.com:8200)
    - name: token
      type: string
      description: Vault authentication token
      secret: true
    - name: mount_path
      type: string
      description: KV secrets engine mount path (e.g., secret)
  optional:
    - name: namespace
      type: string
      default: default
      description: Vault Enterprise namespace
    - name: engine_version
      type: number
      default: 2
      description: KV secrets engine version (1 or 2)
    - name: tls_skip_verify
      type: boolean
      default: false
      description: Skip TLS certificate verification
    - name: timeout
      type: number
      default: 10000
      description: Request timeout in milliseconds

dependencies:
  - module: audit_log
    purpose: Log secret access and lifecycle events
    required: true
  - module: encryption
    purpose: Value encryption at rest within Vault
    required: false
  - module: jobs
    purpose: Automatic rotation scheduling
    required: false

metadata:
  provider_url: https://www.hashicorp.com/products/vault
  docs_url: https://developer.hashicorp.com/vault/docs
