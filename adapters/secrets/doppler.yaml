name: doppler
module: secrets
version: 0.1.0
description: Doppler adapter for secrets management
languages: [typescript, python, go, rust, java]

implements:
  - createSecret
  - getSecretMetadata
  - getSecretValue
  - updateSecretValue
  - revokeSecret
  - listSecrets
  - listVersions

does_not_implement:
  - initiateRotation
  - confirmRotation
  - scheduleRotation
  - grantAccess
  - revokeAccess

config:
  required:
    - name: service_token
      type: string
      description: Doppler service token for authentication
      secret: true
    - name: project
      type: string
      description: Doppler project name
    - name: config
      type: string
      description: Doppler environment config name (e.g., prd, stg)
  optional:
    - name: api_host
      type: string
      default: https://api.doppler.com
      description: Doppler API host
    - name: fallback_only
      type: boolean
      default: false
      description: Only resolve secrets not found in local environment

dependencies:
  - module: audit_log
    purpose: Log secret access events
    required: true

metadata:
  provider_url: https://doppler.com
  docs_url: https://docs.doppler.com
