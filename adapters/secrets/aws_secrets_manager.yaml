name: aws_secrets_manager
module: secrets
version: 0.1.0
description: AWS Secrets Manager adapter for secrets management
languages: [typescript, python, go, rust, java]

implements:
  - createSecret
  - getSecretMetadata
  - getSecretValue
  - updateSecretValue
  - initiateRotation
  - confirmRotation
  - revokeSecret
  - listSecrets
  - listVersions
  - scheduleRotation

does_not_implement:
  - grantAccess
  - revokeAccess

config:
  required:
    - name: region
      type: string
      description: AWS region (e.g., us-east-1)
    - name: access_key_id
      type: string
      description: AWS access key ID
      secret: false
    - name: secret_access_key
      type: string
      description: AWS secret access key
      secret: true
  optional:
    - name: session_token
      type: string
      description: AWS session token for temporary credentials
      secret: true
    - name: kms_key_id
      type: string
      description: Custom KMS key ID for encryption
    - name: recovery_window_in_days
      type: number
      default: 30
      description: Number of days before deleted secret is permanently removed
    - name: endpoint_override
      type: string
      description: Custom AWS endpoint URL

dependencies:
  - module: audit_log
    purpose: Log secret access and lifecycle events
    required: true
  - module: encryption
    purpose: KMS integration for encryption at rest
    required: false
  - module: jobs
    purpose: Automatic rotation scheduling via EventBridge
    required: false

metadata:
  provider_url: https://aws.amazon.com/secrets-manager
  docs_url: https://docs.aws.amazon.com/secretsmanager
