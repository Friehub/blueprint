name: postgres
module: sandbox_environment
version: 0.1.0
description: Custom Postgres adapter for sandbox_environment
languages: [typescript, python, go, rust, java]

implements:
  - provisionSandbox
  - getSandbox
  - listSandboxes
  - resetSandbox
  - seedSandbox
  - extendSandbox
  - expireSandbox
  - getSandboxUsage
  - validateSandboxCredentials

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org