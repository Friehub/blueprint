name: postgres
module: sla_tracking
version: 0.1.0
description: Custom Postgres adapter for sla_tracking
languages: [typescript, python, go, rust, java]

implements:
  - defineSLA
  - getSLA
  - listSLAs
  - getUptime
  - calculateBreach
  - setMaintenanceWindow
  - reportIncident
  - getSLADashboard

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org