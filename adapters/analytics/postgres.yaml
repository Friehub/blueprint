name: postgres
module: analytics
version: 0.1.0
description: Custom Postgres adapter for analytics
languages: [typescript, python, go, rust, java]

implements:
  - trackEvent
  - identifyUser
  - trackPageView
  - getMetrics
  - getFunnel
  - getCohort
  - getRetention

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org