name: postgres
module: push_notifications
version: 0.1.0
description: Custom Postgres adapter for push_notifications
languages: [typescript, python, go, rust, java]

implements:
  - registerDevice
  - unregisterDevice
  - getUserDevices
  - sendPush
  - sendBulkPush
  - sendTopicPush
  - getPushStatus
  - updateDeviceToken

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org