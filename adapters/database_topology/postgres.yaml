name: postgres
module: database_topology
version: 0.1.0
description: Custom Postgres adapter for database_topology
languages: [typescript, python, go, rust, java]

implements:
  - configureSharding
  - getShard
  - listShards
  - addShard
  - removeShard
  - configureReplication
  - getReplicationLag
  - configureFailover
  - triggerFailover

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org