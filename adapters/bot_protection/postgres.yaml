name: postgres
module: bot_protection
version: 0.1.0
description: Custom Postgres adapter for bot_protection
languages: [typescript, python, go, rust, java]

implements:
  - issueChallenge
  - verifyChallenge
  - scoreRequest
  - configureChallenge
  - getChallengeConfig
  - reportBypassAttempt

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org