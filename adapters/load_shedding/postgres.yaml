name: postgres
module: load_shedding
version: 0.1.0
description: Custom Postgres adapter for load_shedding
languages: [typescript, python, go, rust, java]

implements:
  - admitRequest
  - getCapacity
  - setPriority
  - getSheddingStatus
  - setSloBudget
  - getSloBudget

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org