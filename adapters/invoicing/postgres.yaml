name: postgres
module: invoicing
version: 0.1.0
description: Custom Postgres adapter for invoicing
languages: [typescript, python, go, rust, java]

implements:
  - createInvoice
  - issueInvoice
  - sendInvoice
  - getInvoice
  - listInvoices
  - recordInvoicePayment
  - voidInvoice
  - createCreditNote

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org