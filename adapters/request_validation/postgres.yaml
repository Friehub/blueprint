name: postgres
module: request_validation
version: 0.1.0
description: Custom Postgres adapter for request_validation
languages: [typescript, python, go, rust, java]

implements:
  - validatePayload
  - validateField
  - sanitizeForSql
  - sanitizeForShell
  - sanitizeForHtml
  - getMaxPayloadSize
  - setMaxPayloadSize

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org