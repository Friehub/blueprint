name: postgres
module: graceful_shutdown
version: 0.1.0
description: Custom Postgres adapter for graceful_shutdown
languages: [typescript, python, go, rust, java]

implements:
  - registerShutdownHook
  - deregisterShutdownHook
  - initiateShutdown
  - getShutdownStatus
  - setShutdownTimeout
  - getInFlightRequests

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org