name: postgres
module: bank_accounts
version: 0.1.0
description: Custom Postgres adapter for bank_accounts
languages: [typescript, python, go, rust, java]

implements:
  - linkBankAccount
  - getBankAccount
  - listBankAccounts
  - verifyBankAccount
  - setDefaultBankAccount
  - disableBankAccount
  - getVerificationStatus

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org