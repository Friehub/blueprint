name: postgres
module: trace_query
version: 0.1.0
description: Custom Postgres adapter for trace_query
languages: [typescript, python, go, rust, java]

implements:
  - queryTraces
  - getTrace
  - getSpan
  - listServices
  - searchTraces
  - getTraceStats
  - getErrorTraces

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org