name: postgres
module: api_mock
version: 0.1.0
description: Custom Postgres adapter for api_mock
languages: [typescript, python, go, rust, java]

implements:
  - registerMock
  - getMock
  - listMocks
  - updateMockResponse
  - recordRequest
  - getRecordedRequests
  - replayRequests
  - deleteMock

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org