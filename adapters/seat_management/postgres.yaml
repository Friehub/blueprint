name: postgres
module: seat_management
version: 0.1.0
description: Custom Postgres adapter for seat_management
languages: [typescript, python, go, rust, java]

implements:
  - assignSeat
  - releaseSeat
  - transferSeat
  - listSeats
  - getSeatUsage
  - setSeatLimit
  - getSeatPolicy

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org