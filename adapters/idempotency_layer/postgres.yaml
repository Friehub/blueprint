name: postgres
module: idempotency_layer
version: 0.1.0
description: Custom Postgres adapter for idempotency_layer
languages: [typescript, python, go, rust, java]

implements:
  - createIdempotencyKey
  - checkIdempotency
  - registerAttempt
  - completeAttempt
  - failAttempt
  - getStaleKeys
  - releaseStaleKeys

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org