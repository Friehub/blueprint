name: postgres
module: donations
version: 0.1.0
description: Custom Postgres adapter for donations
languages: [typescript, python, go, rust, java]

implements:
  - createCampaign
  - getCampaign
  - listCampaigns
  - donate
  - getDonation
  - getDonationsByCampaign
  - getCampaignStats
  - issueCertificate

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org