name: postgres
module: data_serialization
version: 0.1.0
description: Custom Postgres adapter for data_serialization
languages: [typescript, python, go, rust, java]

implements:
  - registerSchema
  - getSchema
  - evolveSchema
  - validateCompatibility
  - detectFieldNumberConflict
  - migrateDocument

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org