name: postgres
module: stream_processing
version: 0.1.0
description: Custom Postgres adapter for stream_processing
languages: [typescript, python, go, rust, java]

implements:
  - defineStream
  - getStream
  - listStreams
  - startStream
  - stopStream
  - applyTransformation
  - addSink
  - getStreamMetrics
  - getLag

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org