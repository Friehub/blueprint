name: postgres
module: tasks
version: 0.1.0
description: Custom Postgres adapter for tasks
languages: [typescript, python, go, rust, java]

implements:
  - createTask
  - getTask
  - listTasks
  - updateTask
  - assignTask
  - changeTaskStatus
  - addTaskDependency
  - removeTaskDependency
  - completeTask
  - archiveTask

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org