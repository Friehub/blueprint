name: postgres
module: reviews
version: 0.1.0
description: Custom Postgres adapter for reviews
languages: [typescript, python, go, rust, java]

implements:
  - createReview
  - getReview
  - getReviews
  - getAggregateRating
  - updateReview
  - deleteReview
  - moderateReview
  - flagReview
  - getUserReviews

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org