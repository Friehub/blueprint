name: postgres
module: cart
version: 0.1.0
description: Custom Postgres adapter for cart
languages: [typescript, python, go, rust, java]

implements:
  - getCart
  - createCart
  - addToCart
  - updateCartItem
  - removeCartItem
  - clearCart
  - applyCoupon
  - removeCoupon
  - getCartTotal
  - mergeCart

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org