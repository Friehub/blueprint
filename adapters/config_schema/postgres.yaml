name: postgres
module: config_schema
version: 0.1.0
description: Custom Postgres adapter for config_schema
languages: [typescript, python, go, rust, java]

implements:
  - registerSchema
  - getSchema
  - validateConfig
  - coerceType
  - resolveConfig
  - listSchemas

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org