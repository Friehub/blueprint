name: postgres
module: encryption
version: 0.1.0
description: Custom Postgres adapter for encryption
languages: [typescript, python, go, rust, java]

implements:
  - encrypt
  - decrypt
  - generateKey
  - rotateKey
  - listKeys
  - archiveKey
  - hashPassword
  - verifyPassword
  - generateSecret

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org