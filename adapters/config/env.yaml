name: env
module: config
version: 0.1.0
description: Environment variable fallback config adapter
languages: [typescript, python, go, rust, java]

implements:
  - getConfig

does_not_implement:
  - setConfig
  - getConfigs
  - listConfigs
  - approveChange
  - rejectChange
  - rollback
  - getHistory
  - deleteConfig
  - validateConfig

config:
  required: []
  optional:
    - name: prefix
      type: string
      default: APP_CONFIG_
      description: Environment variable prefix for config keys
    - name: separator
      type: string
      default: "__"
      description: Separator for nested config keys in env var names
    - name: fallback_on_missing
      type: boolean
      default: true
      description: Return absent value instead of error when env var is not set

dependencies: []

metadata:
  provider_url: https://en.wikipedia.org/wiki/Environment_variable
  docs_url: https://en.wikipedia.org/wiki/Environment_variable
