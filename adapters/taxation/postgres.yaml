name: postgres
module: taxation
version: 0.1.0
description: Custom Postgres adapter for taxation
languages: [typescript, python, go, rust, java]

implements:
  - calculateTax
  - getTaxRate
  - listTaxRates
  - setTaxProfile
  - getTaxProfile
  - validateTaxId
  - previewTax

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org