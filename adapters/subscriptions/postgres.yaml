name: postgres
module: subscriptions
version: 0.1.0
description: Custom Postgres adapter for subscriptions
languages: [typescript, python, go, rust, java]

implements:
  - getEntitlements
  - hasAccess
  - grantEntitlement
  - revokeEntitlement
  - getAccessHistory

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org