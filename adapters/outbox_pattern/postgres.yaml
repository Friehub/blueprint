name: postgres
module: outbox_pattern
version: 0.1.0
description: Custom Postgres adapter for outbox_pattern
languages: [typescript, python, go, rust, java]

implements:
  - publishEvent
  - processOutbox
  - requeueFailed
  - getPendingCount

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org