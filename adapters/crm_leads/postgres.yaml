name: postgres
module: crm_leads
version: 0.1.0
description: Custom Postgres adapter for crm_leads
languages: [typescript, python, go, rust, java]

implements:
  - createLead
  - updateLeadStatus
  - createDeal
  - updateDealStage
  - assignOwner

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org