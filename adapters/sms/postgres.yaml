name: postgres
module: sms
version: 0.1.0
description: Custom Postgres adapter for sms
languages: [typescript, python, go, rust, java]

implements:
  - send
  - sendBulk
  - getDeliveryStatus
  - getBalance
  - lookupNumber

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org