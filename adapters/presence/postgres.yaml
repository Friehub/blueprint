name: postgres
module: presence
version: 0.1.0
description: Custom Postgres adapter for presence
languages: [typescript, python, go, rust, java]

implements:
  - setOnline
  - setOffline
  - getPresence
  - getPresenceMultiple
  - subscribeToPresence
  - setCustomStatus

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org