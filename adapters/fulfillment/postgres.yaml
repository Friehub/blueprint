name: postgres
module: fulfillment
version: 0.1.0
description: Custom Postgres adapter for fulfillment
languages: [typescript, python, go, rust, java]

implements:
  - createFulfillment
  - getFulfillment
  - listFulfillments
  - assignWarehouse
  - markPacked
  - markShipped
  - markDelivered
  - cancelFulfillment

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org