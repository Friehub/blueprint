name: postgres
module: localization
version: 0.1.0
description: Custom Postgres adapter for localization
languages: [typescript, python, go, rust, java]

implements:
  - getTranslation
  - getTranslations
  - setTranslation
  - listLocales
  - getLocale
  - detectLocale
  - formatCurrency
  - formatDate
  - formatNumber

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org