name: postgres
module: grading
version: 0.1.0
description: Custom Postgres adapter for grading
languages: [typescript, python, go, rust, java]

implements:
  - createRubric
  - getRubric
  - listRubrics
  - gradeSubmission
  - updateGrade
  - publishGrade
  - finalizeGrades
  - getGradebook

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org