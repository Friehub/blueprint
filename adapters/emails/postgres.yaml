name: postgres
module: emails
version: 0.1.0
description: Custom Postgres adapter for emails
languages: [typescript, python, go, rust, java]

implements:
  - sendTransactional
  - sendBulk
  - createTemplate
  - updateTemplate
  - getTemplate
  - listTemplates
  - getDeliveryStatus
  - getDeliveryEvents

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org