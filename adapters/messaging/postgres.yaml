name: postgres
module: messaging
version: 0.1.0
description: Custom Postgres adapter for messaging
languages: [typescript, python, go, rust, java]

implements:
  - createThread
  - getThread
  - getThreads
  - sendMessage
  - getMessages
  - editMessage
  - deleteMessage
  - markRead
  - getUnreadCount
  - addParticipant
  - removeParticipant

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org