name: postgres
module: billing_proration
version: 0.1.0
description: Custom Postgres adapter for billing_proration
languages: [typescript, python, go, rust, java]

implements:
  - calculateProration
  - applyProration
  - getProration
  - listProrations
  - voidProration
  - getProrationPolicy
  - setProrationPolicy

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org