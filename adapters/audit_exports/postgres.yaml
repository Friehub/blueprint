name: postgres
module: audit_exports
version: 0.1.0
description: Custom Postgres adapter for audit_exports
languages: [typescript, python, go, rust, java]

implements:
  - createExportJob
  - getExportJob
  - listExportJobs
  - cancelExportJob
  - downloadExport

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org