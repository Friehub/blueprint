name: postgres
module: attendance
version: 0.1.0
description: Custom Postgres adapter for attendance
languages: [typescript, python, go, rust, java]

implements:
  - markAttendance
  - getAttendanceRecord
  - listAttendance
  - markSessionStart
  - markSessionEnd
  - getAttendanceSummary

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org