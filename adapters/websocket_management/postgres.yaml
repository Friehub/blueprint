name: postgres
module: websocket_management
version: 0.1.0
description: Custom Postgres adapter for websocket_management
languages: [typescript, python, go, rust, java]

implements:
  - createRoom
  - joinRoom
  - leaveRoom
  - getRoomMembers
  - broadcastToRoom
  - sendToUser
  - sendToConnection
  - getUserConnections
  - disconnectUser
  - getRoomStats

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org