name: postgres
module: sse
version: 0.1.0
description: Custom Postgres adapter for sse
languages: [typescript, python, go, rust, java]

implements:
  - createStream
  - subscribe
  - unsubscribe
  - sendEvent
  - sendEvents
  - closeStream
  - getLastEventId

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org