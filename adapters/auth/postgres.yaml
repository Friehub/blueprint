name: postgres
module: auth
version: 0.1.0
description: Custom Postgres adapter for auth
languages: [typescript, python, go, rust, java]

implements:
  - signUp
  - signIn
  - signInWithProvider
  - signOut
  - refreshToken
  - verifyToken
  - requestPasswordReset
  - confirmPasswordReset
  - verifyEmail
  - resendVerification

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org