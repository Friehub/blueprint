name: postgres
module: compliance_reporting
version: 0.1.0
description: Custom Postgres adapter for compliance_reporting
languages: [typescript, python, go, rust, java]

implements:
  - defineReport
  - generateReport
  - getReport
  - listReports
  - mapControl
  - getEvidence
  - exportReport
  - scheduleReport

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org