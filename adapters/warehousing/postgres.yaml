name: postgres
module: warehousing
version: 0.1.0
description: Custom Postgres adapter for warehousing
languages: [typescript, python, go, rust, java]

implements:
  - registerBin
  - assignStockToBin
  - createPickList
  - confirmPick
  - moveStock

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org