name: postgres
module: projects
version: 0.1.0
description: Custom Postgres adapter for projects
languages: [typescript, python, go, rust, java]

implements:
  - createProject
  - getProject
  - listProjects
  - updateProject
  - archiveProject
  - unarchiveProject
  - addProjectMember
  - removeProjectMember
  - changeProjectOwner

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org