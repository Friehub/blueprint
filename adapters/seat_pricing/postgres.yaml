name: postgres
module: seat_pricing
version: 0.1.0
description: Custom Postgres adapter for seat_pricing
languages: [typescript, python, go, rust, java]

implements:
  - createSeatPriceRule
  - getSeatPriceRule
  - listSeatPriceRules
  - updateSeatPriceRule
  - archiveSeatPriceRule
  - quoteSeatCost
  - applySeatAdjustment

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org