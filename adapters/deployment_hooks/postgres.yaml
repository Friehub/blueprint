name: postgres
module: deployment_hooks
version: 0.1.0
description: Custom Postgres adapter for deployment_hooks
languages: [typescript, python, go, rust, java]

implements:
  - registerHook
  - runPreDeployChecks
  - runPostDeploySmoke
  - triggerRollback
  - getDeploymentStatus
  - getHookHistory

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org