name: postgres
module: api_versioning
version: 0.1.0
description: Custom Postgres adapter for api_versioning
languages: [typescript, python, go, rust, java]

implements:
  - registerApi
  - getApi
  - getCurrentVersion
  - deprecateVersion
  - listVersions
  - setVersioningStrategy
  - extendSunset

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org