name: postgres
module: webhooks
version: 0.1.0
description: Custom Postgres adapter for webhooks
languages: [typescript, python, go, rust, java]

implements:
  - registerEndpoint
  - updateEndpoint
  - removeEndpoint
  - listEndpoints
  - dispatchEvent
  - retryDelivery
  - getDeliveries
  - getDelivery

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org