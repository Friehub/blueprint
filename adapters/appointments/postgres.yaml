name: postgres
module: appointments
version: 0.1.0
description: Custom Postgres adapter for appointments
languages: [typescript, python, go, rust, java]

implements:
  - getAvailability
  - bookAppointment
  - getAppointment
  - getAppointmentsByUser
  - cancelAppointment
  - rescheduleAppointment
  - confirmAppointment
  - getWaitlist
  - joinWaitlist

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org