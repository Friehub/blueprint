name: postgres
module: data_residency
version: 0.1.0
description: Custom Postgres adapter for data_residency
languages: [typescript, python, go, rust, java]

implements:
  - declareResidency
  - getResidencyRule
  - listResidencyRules
  - routeRequest
  - verifyCompliance
  - updateResidencyRule
  - removeResidencyRule

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org