name: postgres
module: content_safety
version: 0.1.0
description: Custom Postgres adapter for content_safety
languages: [typescript, python, go, rust, java]

implements:
  - checkContent
  - classifyContent
  - reportViolation
  - getViolation
  - getModerationHistory
  - appealViolation
  - resolveAppeal
  - getSafetyStats

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org