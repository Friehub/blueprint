name: postgres
module: orders
version: 0.1.0
description: Custom Postgres adapter for orders
languages: [typescript, python, go, rust, java]

implements:
  - createOrder
  - getOrder
  - getOrdersByUser
  - getSellerOrders
  - getPackagesByOrder
  - getOrderLinesByPackage
  - transitionOrderStatus
  - transitionPackageStatus
  - cancelOrder
  - requestReturn
  - approveReturn

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org