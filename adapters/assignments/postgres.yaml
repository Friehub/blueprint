name: postgres
module: assignments
version: 0.1.0
description: Custom Postgres adapter for assignments
languages: [typescript, python, go, rust, java]

implements:
  - createAssignment
  - getAssignment
  - listAssignments
  - updateAssignment
  - publishAssignment
  - closeAssignment
  - submitAssignment
  - getSubmission
  - listSubmissions

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org