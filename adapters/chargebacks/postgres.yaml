name: postgres
module: chargebacks
version: 0.1.0
description: Custom Postgres adapter for chargebacks
languages: [typescript, python, go, rust, java]

implements:
  - createChargeback
  - getChargeback
  - listChargebacks
  - submitEvidence
  - updateChargebackStatus
  - closeChargeback

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org