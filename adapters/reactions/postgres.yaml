name: postgres
module: reactions
version: 0.1.0
description: Custom Postgres adapter for reactions
languages: [typescript, python, go, rust, java]

implements:
  - addReaction
  - removeReaction
  - getReactions
  - getUserReaction
  - getTopReacted

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org