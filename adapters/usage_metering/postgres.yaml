name: postgres
module: usage_metering
version: 0.1.0
description: Custom Postgres adapter for usage_metering
languages: [typescript, python, go, rust, java]

implements:
  - recordUsage
  - getUsageSummary
  - checkQuota
  - getOverage
  - setQuota
  - resetUsage
  - getUsageHistory

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org