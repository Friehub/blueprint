name: postgres
module: promotions
version: 0.1.0
description: Custom Postgres adapter for promotions
languages: [typescript, python, go, rust, java]

implements:
  - validateCoupon
  - markCouponUsed
  - getActiveFlashSales
  - getFlashSaleForVariant
  - applyPromotionToCart
  - getEligiblePromotions
  - createPromotion
  - archivePromotion
  - issueGiftCard
  - getGiftCard
  - listGiftCards
  - redeemGiftCard
  - voidGiftCard

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org