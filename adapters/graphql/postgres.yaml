name: postgres
module: graphql
version: 0.1.0
description: Custom Postgres adapter for graphql
languages: [typescript, python, go, rust, java]

implements:
  - defineSchema
  - defineResolver
  - createDataLoader
  - executeQuery
  - executeMutation
  - createSubscription
  - publishSubscription

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org