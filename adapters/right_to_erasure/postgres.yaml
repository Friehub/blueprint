name: postgres
module: right_to_erasure
version: 0.1.0
description: Custom Postgres adapter for right_to_erasure
languages: [typescript, python, go, rust, java]

implements:
  - requestErasure
  - getErasureRequest
  - listErasureRequests
  - identifyDataSources
  - executeErasure
  - certifyDeletion
  - notifyDataRecipients
  - cancelRequest

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org