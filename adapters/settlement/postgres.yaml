name: postgres
module: settlement
version: 0.1.0
description: Custom Postgres adapter for settlement
languages: [typescript, python, go, rust, java]

implements:
  - createSettlementBatch
  - getSettlementBatch
  - listSettlementBatches
  - addSettlementItem
  - closeSettlementBatch
  - confirmSettlement
  - failSettlement
  - reconcileBatch

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org