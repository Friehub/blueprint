name: postgres
module: load_testing
version: 0.1.0
description: Custom Postgres adapter for load_testing
languages: [typescript, python, go, rust, java]

implements:
  - defineScenario
  - getScenario
  - runScenario
  - getRun
  - cancelRun
  - setSlaThresholds
  - validateSla
  - compareRuns

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org