name: postgres
module: cqrs
version: 0.1.0
description: Custom Postgres adapter for cqrs
languages: [typescript, python, go, rust, java]

implements:
  - executeCommand
  - executeQuery
  - defineCommandHandler
  - defineQueryHandler
  - synchronizeModel
  - defineReadModel
  - getReadModel

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org