name: postgres
module: service_mesh
version: 0.1.0
description: Custom Postgres adapter for service_mesh
languages: [typescript, python, go, rust, java]

implements:
  - registerService
  - deregisterService
  - discoverService
  - getEndpoints
  - reportHealth
  - getServiceGraph

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org