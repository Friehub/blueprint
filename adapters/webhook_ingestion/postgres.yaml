name: postgres
module: webhook_ingestion
version: 0.1.0
description: Custom Postgres adapter for webhook_ingestion
languages: [typescript, python, go, rust, java]

implements:
  - ingestWebhook
  - verifySignature
  - deduplicateEvent
  - getIngestedEvent
  - listIngestedEvents
  - reprocessEvent
  - getProviderConfig

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org