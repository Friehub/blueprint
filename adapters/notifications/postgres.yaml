name: postgres
module: notifications
version: 0.1.0
description: Custom Postgres adapter for notifications
languages: [typescript, python, go, rust, java]

implements:
  - sendEmail
  - sendSMS
  - sendPush
  - sendBulkPush
  - sendInApp
  - getNotifications
  - markRead
  - markAllRead
  - getUnreadCount
  - updatePreferences
  - getPreferences

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org