name: postgres
module: zero_trust_network_policy
version: 0.1.0
description: Custom Postgres adapter for zero_trust_network_policy
languages: [typescript, python, go, rust, java]

implements:
  - registerServiceIdentity
  - getServiceIdentity
  - verifyServiceIdentity
  - rotateIdentity
  - listTrustedServices
  - setTrustPolicy
  - getTrustPolicy
  - revokeIdentity

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org