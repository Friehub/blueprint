name: postgres
module: data_quality
version: 0.1.0
description: Custom Postgres adapter for data_quality
languages: [typescript, python, go, rust, java]

implements:
  - defineExpectation
  - getExpectation
  - listExpectations
  - runValidation
  - runAllValidations
  - getValidationHistory
  - getDatasetHealth
  - alertOnDegradation

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org