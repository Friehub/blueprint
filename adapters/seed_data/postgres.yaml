name: postgres
module: seed_data
version: 0.1.0
description: Custom Postgres adapter for seed_data
languages: [typescript, python, go, rust, java]

implements:
  - createSeed
  - listSeeds
  - applySeed
  - snapshot
  - listSnapshots
  - restoreSnapshot
  - resetToBaseline
  - deleteSeed

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org