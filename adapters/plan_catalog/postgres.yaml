name: postgres
module: plan_catalog
version: 0.1.0
description: Custom Postgres adapter for plan_catalog
languages: [typescript, python, go, rust, java]

implements:
  - createPlan
  - getPlan
  - listPlans
  - updatePlan
  - archivePlan
  - getPlanFeatures
  - comparePlans

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org