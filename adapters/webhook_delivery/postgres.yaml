name: postgres
module: webhook_delivery
version: 0.1.0
description: Custom Postgres adapter for webhook_delivery
languages: [typescript, python, go, rust, java]

implements:
  - registerWebhookEndpoint
  - sendWebhook
  - getDeliveryStatus
  - listDeliveries
  - retryDelivery
  - getDeadLetterQueue
  - replayDeadLetter
  - getDeliveryStats

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org