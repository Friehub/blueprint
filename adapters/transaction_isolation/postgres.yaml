name: postgres
module: transaction_isolation
version: 0.1.0
description: Custom Postgres adapter for transaction_isolation
languages: [typescript, python, go, rust, java]

implements:
  - configureIsolation
  - getIsolationLevel
  - executeWithIsolation
  - setLockTimeout
  - setDeadlockPriority
  - detectDeadlocks
  - distributedTransaction

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org