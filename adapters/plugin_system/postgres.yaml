name: postgres
module: plugin_system
version: 0.1.0
description: Custom Postgres adapter for plugin_system
languages: [typescript, python, go, rust, java]

implements:
  - registerPlugin
  - getPlugin
  - listPlugins
  - loadPlugin
  - unloadPlugin
  - enablePlugin
  - disablePlugin
  - validateInterface
  - verifyPluginSignature
  - listHooks
  - triggerHook
  - registerPublisher
  - removePublisher

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org