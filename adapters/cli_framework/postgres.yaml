name: postgres
module: cli_framework
version: 0.1.0
description: Custom Postgres adapter for cli_framework
languages: [typescript, python, go, rust, java]

implements:
  - registerCommand
  - listCommands
  - runCommand
  - getHelp
  - loadConfigFile
  - parseArguments
  - completeCommand

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org