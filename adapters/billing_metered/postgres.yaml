name: postgres
module: billing_metered
version: 0.1.0
description: Custom Postgres adapter for billing_metered
languages: [typescript, python, go, rust, java]

implements:
  - recordUsage
  - getUsage
  - getBillableUsage
  - createMeteredPlan
  - updateMeteredPlan
  - listMeteredPlans
  - getUsageAlerts
  - setUsageAlert

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org