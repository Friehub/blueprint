name: postgres
module: feature_flags
version: 0.1.0
description: Custom Postgres adapter for feature_flags
languages: [typescript, python, go, rust, java]

implements:
  - isEnabled
  - getVariant
  - setFlag
  - archiveFlag
  - listFlags
  - getFlag
  - rolloutToPercent
  - evaluateAll
  - createSegment
  - updateSegment
  - deleteSegment
  - listSegments
  - evaluateSegment
  - setFlag

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org