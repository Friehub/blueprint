name: postgres
module: ip_blocklist
version: 0.1.0
description: Custom Postgres adapter for ip_blocklist
languages: [typescript, python, go, rust, java]

implements:
  - blockIp
  - blockCidr
  - blockAsn
  - unblock
  - isBlocked
  - listEntries
  - importFeed
  - getStats

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org