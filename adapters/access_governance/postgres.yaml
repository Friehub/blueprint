name: postgres
module: access_governance
version: 0.1.0
description: Custom Postgres adapter for access_governance
languages: [typescript, python, go, rust, java]

implements:
  - createReview
  - getReview
  - listReviews
  - submitDecision
  - completeReview
  - revokeStaleAccess
  - scheduleRecurringReview
  - getReviewHistory

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org