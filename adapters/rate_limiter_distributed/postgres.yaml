name: postgres
module: rate_limiter_distributed
version: 0.1.0
description: Custom Postgres adapter for rate_limiter_distributed
languages: [typescript, python, go, rust, java]

implements:
  - checkRateLimit
  - consumeToken
  - getCurrentUsage
  - resetWindow
  - getRateLimitConfig
  - updateRateLimitConfig

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org