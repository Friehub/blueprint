name: postgres
module: error_tracking
version: 0.1.0
description: Custom Postgres adapter for error_tracking
languages: [typescript, python, go, rust, java]

implements:
  - recordError
  - getErrorEvent
  - listErrorEvents
  - getIssue
  - listIssues
  - updateIssue
  - assignIssue
  - muteIssue
  - unmuteIssue
  - createAlertRule
  - getAlertRule
  - listAlertRules

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org