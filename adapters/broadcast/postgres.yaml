name: postgres
module: broadcast
version: 0.1.0
description: Custom Postgres adapter for broadcast
languages: [typescript, python, go, rust, java]

implements:
  - createBroadcast
  - sendBroadcast
  - scheduleBroadcast
  - getBroadcast
  - listBroadcasts
  - getDeliveryStatus
  - cancelBroadcast

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org