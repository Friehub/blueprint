name: postgres
module: shipping
version: 0.1.0
description: Custom Postgres adapter for shipping
languages: [typescript, python, go, rust, java]

implements:
  - getRates
  - createShipment
  - getShipment
  - trackShipment
  - cancelShipment
  - createLabel
  - getLabel
  - validateAddress

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org