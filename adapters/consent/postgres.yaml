name: postgres
module: consent
version: 0.1.0
description: Custom Postgres adapter for consent
languages: [typescript, python, go, rust, java]

implements:
  - recordConsent
  - getConsent
  - withdrawConsent
  - hasConsented
  - getConsentHistory
  - exportUserData
  - deleteUserData
  - getJob

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org