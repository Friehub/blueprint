name: postgres
module: vector_store
version: 0.1.0
description: Custom Postgres adapter for vector_store
languages: [typescript, python, go, rust, java]

implements:
  - upsertCollection
  - deleteCollection
  - upsertVectors
  - deleteVectors
  - search
  - getVector
  - getCollectionStats
  - listCollections

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org