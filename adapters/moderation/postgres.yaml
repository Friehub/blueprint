name: postgres
module: moderation
version: 0.1.0
description: Custom Postgres adapter for moderation
languages: [typescript, python, go, rust, java]

implements:
  - createCase
  - getCase
  - listCases
  - assignReviewer
  - recordDecision
  - escalateCase
  - closeCase
  - exportCases

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org