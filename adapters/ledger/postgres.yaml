name: postgres
module: ledger
version: 0.1.0
description: Custom Postgres adapter for ledger
languages: [typescript, python, go, rust, java]

implements:
  - createLedger
  - createAccount
  - postTransaction
  - getAccountBalance
  - getLedgerTransactions

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org