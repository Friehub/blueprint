name: postgres
module: http_security_headers
version: 0.1.0
description: Custom Postgres adapter for http_security_headers
languages: [typescript, python, go, rust, java]

implements:
  - getHeaders
  - validateResponse
  - getCorsPolicy
  - setCorsPolicy
  - getHstsPolicy

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org