name: postgres
module: read_receipts
version: 0.1.0
description: Custom Postgres adapter for read_receipts
languages: [typescript, python, go, rust, java]

implements:
  - markRead
  - markBulkRead
  - markThreadRead
  - getUnreadCount
  - getReadReceipts
  - subscribeReadReceipts
  - getLastReadMessage

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org