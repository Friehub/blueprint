name: postgres
module: payouts
version: 0.1.0
description: Custom Postgres adapter for payouts
languages: [typescript, python, go, rust, java]

implements:
  - createPayout
  - getPayout
  - listPayouts
  - cancelPayout
  - retryPayout
  - schedulePayout
  - getPayoutSchedule

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org