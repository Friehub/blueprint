name: postgres
module: data_catalog
version: 0.1.0
description: Custom Postgres adapter for data_catalog
languages: [typescript, python, go, rust, java]

implements:
  - registerDataset
  - getDataset
  - listDatasets
  - updateDataset
  - addLineage
  - getLineage
  - tagDataset
  - searchDatasets
  - archiveDataset

does_not_implement: []

config:
  required:
    - name: database_url
      type: string
      description: Postgres connection string
      secret: true

metadata:
  provider_url: https://postgresql.org